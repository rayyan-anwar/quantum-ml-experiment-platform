services:
  quantum-ml-experiment-platform:
    build: .
    ports:
      - "8017:8017"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8017/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
